<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mini Messenger — 迷你星球郵差</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87c5e8;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; touch-action: none; }
  #hud, .panel, #mobile, .stick, .pad, .knob, #btns, .rbtn, .emo, #emoteBar,
  #gyroBtn, #fxBtn, #toonBtn, .bigbtn { touch-action: none; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .panel { position: absolute; pointer-events: none; }

  #tasks {
    top: 16px; left: 16px;
    background: rgba(30, 40, 60, .55);
    backdrop-filter: blur(6px);
    border-radius: 14px; padding: 12px 16px;
    font-size: 14px; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
    min-width: 180px;
  }
  #tasks h2 { font-size: 13px; letter-spacing: .08em; opacity: .8; margin-bottom: 6px; text-transform: uppercase; }
  #tasks .count { font-size: 26px; font-weight: 700; }
  #tasks .hint { font-size: 12px; opacity: .75; margin-top: 6px; }
  #tasks #timer { font-size: 15px; font-weight: 700; opacity: .85; font-variant-numeric: tabular-nums; }
  #tasks .parcel { font-size: 12px; opacity: .85; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  #parcelSwatch { width: 16px; height: 16px; border-radius: 4px; background: #888; box-shadow: 0 0 0 2px rgba(255,255,255,.5) inset; }

  #compass {
    top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(30,40,60,.45); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    opacity: 0; transition: opacity .3s;
  }
  #compass .dist { opacity: .8; font-weight: 400; }

  #prompt {
    bottom: 110px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #234;
    border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 15px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0; transition: opacity .2s, transform .2s; transform: translateX(-50%) translateY(8px);
  }
  #prompt.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #prompt b { color: #e0533d; }

  #toast {
    bottom: 50%; left: 50%; transform: translate(-50%, 50%) scale(.9);
    font-size: 30px; font-weight: 800; text-shadow: 0 4px 14px rgba(0,0,0,.35);
    opacity: 0; transition: opacity .35s, transform .35s; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 50%) scale(1); }

  /* Controls help */
  #help { bottom: 16px; left: 16px; font-size: 12px; opacity: .8; line-height: 1.6;
    background: rgba(30,40,60,.4); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(4px); }
  #help kbd { background: rgba(255,255,255,.85); color:#234; border-radius:4px; padding:1px 6px; font-weight:700; font-size:11px; }

  #gyroBtn { position: fixed; top: 16px; right: 16px; z-index: 30; display: none; pointer-events: auto;
    background: rgba(30,40,60,.55); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(6px); cursor: pointer; }
  #gyroBtn.on { background: rgba(224,83,61,.9); border-color: rgba(255,255,255,.5); }

  #fxBtn { position: fixed; top: 56px; right: 16px; z-index: 30; pointer-events: auto;
    background: rgba(30,40,60,.55); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(6px); cursor: pointer; }
  #fxBtn.on { background: rgba(120,90,210,.9); border-color: rgba(255,255,255,.5); }

  #toonBtn { position: fixed; top: 96px; right: 16px; z-index: 30; pointer-events: auto;
    background: rgba(30,40,60,.55); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(6px); cursor: pointer; }
  #toonBtn.on { background: rgba(232,150,40,.92); border-color: rgba(255,255,255,.5); }

  #faceBtn { position: fixed; top: 136px; right: 16px; z-index: 30; pointer-events: auto;
    background: rgba(30,40,60,.55); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(6px); cursor: pointer; }
  #faceBtn.on { background: rgba(60,170,120,.92); border-color: rgba(255,255,255,.5); }

  #soundBtn { position: fixed; top: 176px; right: 16px; z-index: 30; pointer-events: auto;
    background: rgba(30,40,60,.55); color: #fff; border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(6px); cursor: pointer; }
  #soundBtn.off { opacity: .55; }

  /* Mobile buttons */
  #mobile { position: fixed; inset: 0; pointer-events: none; display: none; }
  .stick { position: absolute; bottom: 30px; pointer-events: auto; }
  #stickL { left: 30px; }
  .pad { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); position: relative; }
  .knob { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.55); position: absolute; left: 33px; top: 33px; }
  #btns { right: 26px; bottom: 36px; pointer-events: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .rbtn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font-weight: 800; font-size: 13px; display:flex; align-items:center; justify-content:center; }
  #btnAct { background: rgba(224,83,61,.85); }

  /* Emote bar */
  #emoteBar { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; }
  .emo { font-size: 22px; background: rgba(30,40,60,.45); border-radius: 10px; width: 40px; height: 40px;
    display:flex; align-items:center; justify-content:center; cursor: pointer; backdrop-filter: blur(4px);
    border: none; transition: transform .1s; }
  .emo:active { transform: scale(.85); }

  /* Start / End overlay */
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #aee0ff 0%, #6fb4dd 55%, #3f86b8 100%); color: #fff; text-align: center; z-index: 50; }
  #overlay h1 { font-size: clamp(34px, 8vw, 64px); font-weight: 900; letter-spacing: .02em; text-shadow: 0 6px 0 rgba(0,0,0,.12); }
  #overlay p { margin-top: 10px; font-size: 16px; opacity: .92; max-width: 460px; padding: 0 24px; line-height: 1.6; }
  #overlay .controls { margin-top: 18px; font-size: 13px; opacity: .85; line-height: 1.8; }
  #overlay .controls kbd { background: rgba(255,255,255,.85); color:#234; border-radius:4px; padding:1px 7px; font-weight:700; }
  .bigbtn { margin-top: 28px; pointer-events: auto; cursor: pointer; border: none;
    background: #ffd23f; color: #5a3d00; font-weight: 900; font-size: 20px; letter-spacing: .05em;
    padding: 16px 48px; border-radius: 999px; box-shadow: 0 8px 0 #d8a800, 0 14px 24px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
  .bigbtn:active { transform: translateY(5px); box-shadow: 0 3px 0 #d8a800, 0 6px 14px rgba(0,0,0,.25); }
  #overlay.hidden { display: none; }
  .loading { margin-top: 20px; font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div id="tasks" class="panel">
    <h2>📮 今日派件</h2>
    <div><span class="count" id="delivered">0</span> / <span id="total">5</span> &nbsp; <span id="timer">0:00</span></div>
    <div class="parcel" id="parcelRow">手上包裹 <span id="parcelSwatch"></span></div>
    <div class="hint" id="taskHint">把包裹送到「同色」的信箱</div>
  </div>
  <div id="compass" class="panel">🧭 <span>下一站</span><span class="dist" id="dist">— m</span></div>
  <div id="prompt" class="panel">靠近信箱,按 <b>E</b> / 點擊 投遞</div>
  <div id="toast" class="panel"></div>
  <div id="help" class="panel">
    <kbd>W A S D</kbd> / 方向鍵 移動 &nbsp; <kbd>Space</kbd> 跳 &nbsp; <kbd>E</kbd> 投遞<br/>
    滑鼠拖曳 轉視角 &nbsp; 滾輪 縮放
  </div>
</div>

<button id="gyroBtn">📱 體感視角</button>
<button id="fxBtn">✨ 特效</button>
<button id="toonBtn">🎨 卡通</button>
<button id="faceBtn">😮 表情控制</button>
<button id="soundBtn">🔊 聲音</button>

<div id="mobile">
  <div id="stickL" class="stick"><div class="pad"><div class="knob" id="knobL"></div></div></div>
  <div id="btns">
    <div class="rbtn" id="btnJump">跳</div>
    <div class="rbtn" id="btnAct">送</div>
  </div>
</div>

<div id="emoteBar" class="panel" style="position:fixed;">
  <button class="emo" data-e="👋">👋</button>
  <button class="emo" data-e="❤️">❤️</button>
  <button class="emo" data-e="😄">😄</button>
  <button class="emo" data-e="🎉">🎉</button>
  <button class="emo" data-e="💌">💌</button>
</div>

<div id="overlay">
  <h1>MINI MESSENGER</h1>
  <p>歡迎來到迷你星球!你手上會拿到一個<b>有顏色的包裹</b>,把它送到<b>同色的信箱</b>。跟著頭上的箭頭走,計時越快星級越高。星球很小,小到看得見地平線的弧度。</p>
  <div class="controls">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 · <kbd>Space</kbd> 跳躍 · <kbd>E</kbd> 投遞 · 滑鼠 轉視角<br/>
    (手機:左下搖桿移動,右下按鈕跳躍 / 投遞,右上「📱 體感視角」可用傾斜手機轉鏡頭)
  </div>
  <button class="bigbtn" id="beginBtn">BEGIN</button>
  <div class="loading" id="loading">載入引擎中…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

// ---------- Config ----------
const PLANET_R = 16;          // planet radius (small => visible curvature)
const GRAVITY = 26;
const JUMP_V = 9.5;
const MOVE_SPEED = 5.2;       // metres/sec along surface
const TURN_SPEED = 2.6;       // rad/sec
const NUM_TASKS = 5;
const DELIVER_RANGE = 2.4;

// ---------- Scene ----------
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfeafe);
scene.fog = new THREE.Fog(0xcfeafe, 34, 78);

// Gradient sky dome
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    topCol: { value: new THREE.Color(0x4a93cf) },
    midCol: { value: new THREE.Color(0x9bd2f0) },
    botCol: { value: new THREE.Color(0xeaf7ff) }
  },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vP; uniform vec3 topCol; uniform vec3 midCol; uniform vec3 botCol;
    void main(){
      float h = normalize(vP).y * 0.5 + 0.5;
      vec3 c = h < 0.5 ? mix(botCol, midCol, smoothstep(0.0,0.5,h))
                       : mix(midCol, topCol, smoothstep(0.5,1.0,h));
      gl_FragColor = vec4(c, 1.0);
    }`
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(170, 32, 16), skyMat);
scene.add(skyDome);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // filmic, "baked" feel
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

// Stop the browser from scrolling / pinch-zooming / pull-to-refresh during play
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
let _lastTouchEnd=0;
document.addEventListener('touchend', e=>{                 // kill iOS double-tap zoom
  const now=Date.now(); if(now-_lastTouchEnd<320) e.preventDefault(); _lastTouchEnd=now;
}, {passive:false});

// Soft image-based lighting from a procedural room (no assets, gives that polished look)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const ENV_INTENSITY = 0.35;   // keep reflections subtle

// Lights (toned down to balance the new ambient IBL)
const sun = new THREE.DirectionalLight(0xfff4d6, 1.7);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.radius = 4; sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe9ff, 0x5a8a4a, 0.5));
scene.add(new THREE.AmbientLight(0xfff3e0, 0.1));
const rim = new THREE.DirectionalLight(0xa9d8ff, 0.35); // cool back rim light
rim.position.set(-25, 10, -30);
scene.add(rim);

// Stars / clouds far backdrop (simple)
const cloudGroup = new THREE.Group();
for (let i = 0; i < 14; i++) {
  const c = new THREE.Mesh(
    new THREE.IcosahedronGeometry(THREE.MathUtils.randFloat(2, 4), 0),
    new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 })
  );
  const dir = new THREE.Vector3().randomDirection().multiplyScalar(THREE.MathUtils.randFloat(40, 55));
  c.position.copy(dir);
  c.scale.y = 0.5;
  cloudGroup.add(c);
}
scene.add(cloudGroup);

// ---------- Procedural detail textures (canvas-based, no external assets) ----------
function makeTex(size, draw, rep){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'); draw(x,size);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); t.anisotropy=4;
  return t;
}
// fine grain — multiplied over a material colour to break up flat plastic look
const grainTex = makeTex(128,(x,s)=>{
  const img=x.createImageData(s,s);
  for(let i=0;i<img.data.length;i+=4){ const v=212+(Math.random()*43|0); img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; }
  x.putImageData(img,0,0);
},[2,2]);
// wood grain (vertical streaks)
const barkTex = makeTex(128,(x,s)=>{
  x.fillStyle='#dad7d2'; x.fillRect(0,0,s,s);
  for(let i=0;i<70;i++){ x.strokeStyle=`rgba(120,108,96,${0.12+Math.random()*0.22})`; x.lineWidth=1+Math.random()*2;
    const xx=Math.random()*s; x.beginPath(); x.moveTo(xx,0);
    x.bezierCurveTo(xx+(Math.random()-0.5)*6,s/2,xx+(Math.random()-0.5)*6,s/2,xx,s); x.stroke(); }
},[1,1]);
// roof shingles (offset rows)
const shingleTex = makeTex(128,(x,s)=>{
  x.fillStyle='#ececec'; x.fillRect(0,0,s,s);
  const rows=8, rh=s/rows;
  x.fillStyle='rgba(70,55,48,0.18)';
  for(let r=0;r<rows;r++){ const off=(r%2)*rh*0.5;
    for(let cc=-1;cc<rows+1;cc++) x.fillRect(cc*rh+off+1, r*rh+rh*0.55, rh-2, rh*0.45); }
  x.strokeStyle='rgba(0,0,0,0.12)'; x.lineWidth=1;
  for(let r=0;r<=rows;r++){ x.beginPath(); x.moveTo(0,r*rh); x.lineTo(s,r*rh); x.stroke(); }
},[2,2]);

// ---------- Planet ----------
const planetGeo = new THREE.IcosahedronGeometry(PLANET_R, 12);
// gentle hills via noise
const pos = planetGeo.attributes.position;
const v = new THREE.Vector3();
function hash(n){ return (Math.sin(n)*43758.5453)%1; }
const BUMP_AMP = 0.3;                                 // gentler hills so things don't sink/tilt
function bumpAt(n){ return Math.sin(n.x*3.1)*Math.cos(n.y*2.7)*Math.sin(n.z*3.4); }
for (let i=0;i<pos.count;i++){
  v.fromBufferAttribute(pos,i);
  const n = v.clone().normalize();
  const r = PLANET_R + bumpAt(n)*BUMP_AMP;
  v.copy(n).multiplyScalar(r);
  pos.setXYZ(i, v.x, v.y, v.z);
}
planetGeo.computeVertexNormals();
// per-vertex biome colours for richer terrain
const cValley = new THREE.Color(0x3f8a3c);
const cGrass  = new THREE.Color(0x6cb24a);
const cHill   = new THREE.Color(0x8fc862);
const cSand   = new THREE.Color(0xdcc98f);
const cRock   = new THREE.Color(0x9c9a8c);
// vertex colours now carry only baked AO (grayscale); biome colour is per-fragment
const colArr = new Float32Array(pos.count*3).fill(1);
planetGeo.setAttribute('color', new THREE.Float32BufferAttribute(colArr, 3));

// Per-fragment terrain colour (eliminates triangle facets regardless of mesh density)
const TERRAIN_GLSL = `
varying vec3 vTPos;
vec3 terrainColor(vec3 p){
  float R = ${PLANET_R.toFixed(1)};
  float A = ${BUMP_AMP.toFixed(3)};
  float h = length(p) - R;
  float t = clamp((h + A)/(2.0*A), 0.0, 1.0);
  vec3 cValley = vec3(0.247,0.541,0.235);
  vec3 cGrass  = vec3(0.424,0.698,0.290);
  vec3 cHill   = vec3(0.561,0.784,0.384);
  vec3 cSand   = vec3(0.863,0.788,0.561);
  vec3 cRock   = vec3(0.612,0.604,0.549);
  vec3 col = mix(cValley, cGrass, smoothstep(0.0,0.55,t));
  col = mix(col, cHill, smoothstep(0.55,1.0,t));
  vec3 n = normalize(p);
  float sand = sin(n.x*5.2+1.3)*cos(n.z*4.7);
  col = mix(col, cSand, smoothstep(0.62,0.92,sand)*(1.0-smoothstep(0.45,0.7,t))*0.85);
  col = mix(col, cRock, smoothstep(0.82,1.0,t));
  return col;
}`;
function injectTerrain(mat){
  mat.onBeforeCompile = (sh)=>{
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vTPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n  vTPos = position;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n'+TERRAIN_GLSL)
      .replace('#include <color_fragment>', '#include <color_fragment>\n  diffuseColor.rgb *= terrainColor(vTPos);');
  };
  mat.customProgramCacheKey = ()=> 'terrain_'+mat.type;
  mat.needsUpdate = true;
}

const planet = new THREE.Mesh(planetGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, flatShading: true, roughness: 0.95
}));
injectTerrain(planet.material);
planet.receiveShadow = true;
scene.add(planet);

// ---------- Water: a sea-level sphere that pools into the low valleys ----------
const waterTime = { value: 0 };
const waterMat = new THREE.MeshStandardMaterial({
  color:0x4fb4d6, transparent:true, opacity:0.82, roughness:0.12, metalness:0.0
});
waterMat.onBeforeCompile = (sh)=>{
  sh.uniforms.uTime = waterTime;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uTime;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\n float wv = sin(position.x*7.0+uTime*1.4)*cos(position.z*7.0+uTime*1.1)*0.025; transformed += normalize(position)*wv;');
};
const water = new THREE.Mesh(new THREE.IcosahedronGeometry(PLANET_R-0.08, 24), waterMat);
water.userData.noToon = true;     // keep its translucent look, don't cel-shade
scene.add(water);

// helper: surface point + up for a given direction
function surface(dir){ return dir.clone().normalize().multiplyScalar(PLANET_R); }
// actual terrain radius (follows the hills) for a given direction
function terrainRadius(dir){ return PLANET_R + bumpAt(dir.clone().normalize())*BUMP_AMP; }

// Orient object so its +Y points along `up`, facing `fwd`
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion();
function orient(obj, up, fwd){
  const u = up.clone().normalize();
  // forward projected onto the tangent plane
  let f = fwd.clone().sub(u.clone().multiplyScalar(fwd.dot(u)));
  if (f.lengthSq() < 1e-8){                       // fwd ~parallel to up: pick any tangent
    f.copy(Math.abs(u.y) < 0.99 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0));
    f.sub(u.clone().multiplyScalar(f.dot(u)));
  }
  f.normalize();
  const right = new THREE.Vector3().crossVectors(u, f).normalize();
  // proper right-handed rotation: x=right, y=up, z=forward (model front = +Z)
  _m.makeBasis(right, u, f);
  obj.quaternion.setFromRotationMatrix(_m);
}

function placeOnPlanet(obj, dir){
  const up = dir.clone().normalize();
  obj.position.copy(up.clone().multiplyScalar(terrainRadius(up) - 0.04)); // sit on the hills
  orient(obj, up, new THREE.Vector3(0,0,1));
}

const rng = (()=>{ let s=1337; return ()=> (s=(s*16807)%2147483647)/2147483647; })();
function randDir(){ return new THREE.Vector3(rng()*2-1, rng()*2-1, rng()*2-1).normalize(); }

// place an object near a base direction with a small angular jitter
function jitterDir(base, spread){
  const t1=new THREE.Vector3(0,1,0).cross(base); if(t1.lengthSq()<1e-4) t1.set(1,0,0); t1.normalize();
  const t2=new THREE.Vector3().crossVectors(base,t1).normalize();
  const a=(rng()*2-1)*spread, b=(rng()*2-1)*spread;
  return base.clone().add(t1.multiplyScalar(a)).add(t2.multiplyScalar(b)).normalize();
}
function scatter(makeFn, n, collideR=0, type=null){
  for(let i=0;i<n;i++){
    const dir=randDir();
    const o=makeFn(); placeOnPlanet(o, dir);
    o.rotateY(rng()*Math.PI*2);
    scene.add(o);
    if(collideR>0) colliders.push({dir:dir.clone().normalize(), r:collideR});
    if(type && swappables[type]) swappables[type].push(o);
  }
}

// ---------- Roads: dirt paths looping through every village ----------
function slerpDir(a,b,t){
  const d=THREE.MathUtils.clamp(a.dot(b),-1,1), om=Math.acos(d);
  if(om<1e-4) return a.clone();
  const so=Math.sin(om);
  return a.clone().multiplyScalar(Math.sin((1-t)*om)/so)
          .add(b.clone().multiplyScalar(Math.sin(t*om)/so)).normalize();
}
const roadMat=new THREE.MeshStandardMaterial({color:0xcaa46a, roughness:1, side:THREE.DoubleSide});
roadMat.polygonOffset=true; roadMat.polygonOffsetFactor=-2; roadMat.polygonOffsetUnits=-2;
function makeRoad(a,b,width=0.55){
  const segs=56, vp=[], idx=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const dir=slerpDir(a,b,t);
    const c=dir.clone().multiplyScalar(terrainRadius(dir)+0.03);
    const dir2=slerpDir(a,b,Math.min(1,t+1/segs));
    let fwd=dir2.clone().sub(dir);
    if(fwd.lengthSq()<1e-9) fwd=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0));
    fwd.normalize();
    const side=new THREE.Vector3().crossVectors(dir,fwd).normalize().multiplyScalar(width/2);
    const l=c.clone().sub(side), r=c.clone().add(side);
    vp.push(l.x,l.y,l.z, r.x,r.y,r.z);
  }
  for(let i=0;i<segs;i++){ const a0=i*2,b0=i*2+1,a1=i*2+2,b1=i*2+3; idx.push(a0,b0,a1, b0,b1,a1); }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vp,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  const m=new THREE.Mesh(geo, roadMat); m.receiveShadow=true; return m;
}

// ---------- Bake AO into the terrain (one-time, runtime-free) ----------
// Darkens valleys and pools soft shadow around every prop — the "baked" look.
(function bakeGroundAO(){
  const colAttr=planetGeo.attributes.color, posAttr=planetGeo.attributes.position;
  const cosT = colliders.map(c=>Math.cos((c.r+0.55)/PLANET_R)); // skip far props without acos
  const p=new THREE.Vector3();
  for(let i=0;i<posAttr.count;i++){
    p.fromBufferAttribute(posAttr,i);
    const len=p.length();
    const n=p.clone().multiplyScalar(1/len);
    const h=len-PLANET_R;                                  // valley AO (concave = darker)
    let ao = THREE.MathUtils.clamp(1.0 + Math.min(0,h)*0.6, 0.8, 1.0);
    let occ=0;                                             // prop contact AO
    for(let k=0;k<colliders.length;k++){
      const c=colliders[k], cosA=n.dot(c.dir);
      if(cosA>cosT[k]){
        const ang=Math.acos(THREE.MathUtils.clamp(cosA,-1,1))*PLANET_R;
        const rad=c.r+0.55;
        occ=Math.max(occ, 1-ang/rad);
      }
    }
    const f = ao*(1-occ*0.3);
    colAttr.setXYZ(i, colAttr.getX(i)*f, colAttr.getY(i)*f, colAttr.getZ(i)*f);
  }
  colAttr.needsUpdate=true;
})();

//   character: { url:'models/courier.glb', height:1.1, rotY:Math.PI }
//   character: { url:'models/courier.glb', height:1.1, rotY:Math.PI }
//   tree:      { url:'models/tree.glb',    height:1.6 }
//   house:     { url:'models/house.glb',   height:1.6 }
const MODELS = { character: null, tree: null, house: null };
const gltfLoader = new GLTFLoader();
function loadGLB(url){ return new Promise((res,rej)=> gltfLoader.load(url, res, undefined, rej)); }
function normalizeModel(obj, targetH, opts={}){
  const box=new THREE.Box3().setFromObject(obj), size=new THREE.Vector3();
  box.getSize(size);
  obj.scale.setScalar((targetH/(size.y||1))*(opts.scale||1));
  box.setFromObject(obj); obj.position.y -= box.min.y;     // feet to local origin
  if(opts.rotY) obj.rotateY(opts.rotY);
  obj.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
}
// bring a freshly-loaded model into the game's smooth + toon + AO look
function styleModel(root){
  root.traverse(o=>{
    if(o.isMesh && o.geometry && o.geometry.index===null && !_smoothed.has(o.geometry)){ smoothNormals(o.geometry); _smoothed.add(o.geometry); }
    if(o.material && 'flatShading' in o.material && o.material.flatShading){ o.material.flatShading=false; o.material.needsUpdate=true; }
    if(o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity=ENV_INTENSITY;
    if(o.material && o.material.isMeshStandardMaterial){
      const s=o.material;
      const t=new THREE.MeshToonMaterial({ color:s.color.clone(), map:s.map||null, gradientMap:toonGrad,
        vertexColors:s.vertexColors, transparent:s.transparent, opacity:s.opacity, side:s.side,
        flatShading:false, emissive:(s.emissive?s.emissive.clone():new THREE.Color(0)) });
      toonPairs.push({o, std:s, toon:t});
      o.material = toonOn ? t : s;
    }
  });
}
// replace every placed instance of a type (tree/house) with a model clone
async function applyModel(type, cfg){
  if(!cfg || !cfg.url || !swappables[type]) return;
  try{
    const gltf=await loadGLB(cfg.url);
    for(const obj of swappables[type]){
      const m=skeletonClone(gltf.scene);
      normalizeModel(m, cfg.height || 1.6, Object.assign({}, cfg, {scale:(cfg.scale||1)*(0.9+rng()*0.3)}));
      for(let i=obj.children.length-1;i>=0;i--) obj.remove(obj.children[i]); // drop procedural mesh
      obj.add(m, shadowDisc(type==='house'?0.85:0.6));
      styleModel(m);

}

// ---------- Audio: procedural music + SFX (no files) ----------
const Sound = (()=>{
  let ctx=null, master=null, musicOn=true, timer=null;
  function init(){ if(ctx) return; try{
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
  }catch(e){ ctx=null; } }
  function envGain(a,d,peak){ const g=ctx.createGain(); const t=ctx.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); return g; }
  function tone(freq, {type='sine',a=0.01,d=0.2,peak=0.3,detune=0,dest=null}={}){
    if(!ctx) return; const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=envGain(a,d,peak);
    o.type=type; o.frequency.value=freq; o.detune.value=detune;
    o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+a+d+0.05);
  }
  function noise({d=0.15,peak=0.3,lp=1200}={}){
    if(!ctx) return; const len=Math.floor(ctx.sampleRate*(d+0.05));
    const buf=ctx.createBuffer(1,len,ctx.sampleRate), da=buf.getChannelData(0);
    for(let i=0;i<len;i++) da[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=envGain(0.005,d,peak); const f=ctx.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=lp;
    src.connect(f); f.connect(g); g.connect(master); src.start(ctx.currentTime);
  }
  const SCALE=[523.25,587.33,659.25,783.99,880.0,1046.5];
  function musicTick(){ if(!ctx||!musicOn) return;
    if(Math.random()<0.66){ const f=SCALE[(Math.random()*SCALE.length)|0];
      tone(f,{type:'triangle',a:0.01,d:0.6,peak:0.10});
      if(Math.random()<0.3) tone(f/2,{type:'sine',a:0.02,d:0.9,peak:0.05}); } }
  function startMusic(){ if(!ctx||timer) return;
    const padG=ctx.createGain(); padG.gain.value=0.045; padG.connect(master);
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=560; f.connect(padG);
    [130.81,196.0].forEach(fr=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=fr; o.connect(f); o.start(); });
    timer=setInterval(musicTick,620); }
  return {
    start(){ init(); if(ctx&&ctx.state==='suspended') ctx.resume(); startMusic(); },
    setMuted(m){ musicOn=!m; if(master) master.gain.value=m?0:0.5; },
    step(){ noise({d:0.08,peak:0.06,lp:850}); },
    jump(){ tone(440,{type:'sine',a:0.005,d:0.14,peak:0.22}); tone(660,{type:'sine',a:0.02,d:0.18,peak:0.12}); },
    land(){ noise({d:0.11,peak:0.16,lp:480}); tone(150,{type:'sine',a:0.005,d:0.12,peak:0.18}); },
    chime(){ [659.25,880,1046.5].forEach((f,i)=> setTimeout(()=>tone(f,{type:'triangle',a:0.01,d:0.5,peak:0.18}), i*90)); },
    win(){ [523,659,784,1046,1319].forEach((f,i)=> setTimeout(()=>tone(f,{type:'triangle',a:0.01,d:0.55,peak:0.2}), i*130)); },
    wrong(){ tone(180,{type:'square',a:0.005,d:0.15,peak:0.12}); }
  };
})();

const puffs=[];
function spawnPuff(pos, up, opts={}){
  const n=opts.n||8, col=opts.color!=null?opts.color:0xffffff, spd=opts.spd||1.6,
        size=opts.size||0.28, life=opts.life||0.5, rise=opts.rise!=null?opts.rise:0.6;
  let t1=new THREE.Vector3(0,1,0).cross(up); if(t1.lengthSq()<1e-4) t1.set(1,0,0); t1.normalize();
  const t2=new THREE.Vector3().crossVectors(up,t1).normalize();
  for(let i=0;i<n;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:dustTex, color:col, transparent:true,
      depthWrite:false, blending: opts.additive?THREE.AdditiveBlending:THREE.NormalBlending, opacity:0.9}));
    sp.scale.setScalar(size*(0.6+Math.random()*0.7)); sp.position.copy(pos);
    const ang=Math.random()*Math.PI*2, sp2=spd*(0.5+Math.random());
    const vel=t1.clone().multiplyScalar(Math.cos(ang)*sp2)
      .add(t2.clone().multiplyScalar(Math.sin(ang)*sp2))
      .add(up.clone().multiplyScalar(rise+Math.random()*0.5));
    sp.userData={vel, life:0, max:life*(0.7+Math.random()*0.6), up};
    scene.add(sp); puffs.push(sp);
  }
}
function updatePuffs(dt){
  for(let i=puffs.length-1;i>=0;i--){
    const sp=puffs[i], u=sp.userData; u.life+=dt;
    sp.position.addScaledVector(u.vel, dt);
    u.vel.addScaledVector(u.up, -3.2*dt); u.vel.multiplyScalar(1-2.4*dt);
    sp.material.opacity=Math.max(0, 0.9*(1-u.life/u.max));
    sp.scale.multiplyScalar(1+dt*1.6);
    if(u.life>=u.max){ scene.remove(sp); puffs.splice(i,1); }
  }
}

  heldParcel.visible=true; heldParcel.material.color.setHex(parcelColor);

  document.getElementById('beginBtn').textContent='RESTART';
  overlay.classList.remove('hidden');
  // reset for next run
  mailboxes.forEach(mb=>{ mb.userData.done=false; mb.userData.ring.visible=true; mb.userData.beam.visible=true; });
  delivered=0; elDelivered.textContent='0';
  started=false;
}

// ---------- Resize ----------
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
  if(tiltPass) tiltPass.uniforms.resolution.value.set(innerWidth, innerHeight);
});

// ---------- Collision ----------
const PLAYER_R = 0.27;
function resolveCollisions(){
  for(const c of colliders){
    const cosA = THREE.MathUtils.clamp(pUp.dot(c.dir), -1, 1);
    const ang = Math.acos(cosA);
    const minAng = (c.r + PLAYER_R) / PLANET_R;
    if(ang < minAng){
      let tan = pUp.clone().sub(c.dir.clone().multiplyScalar(cosA)); // direction away from obstacle
      if(tan.lengthSq() < 1e-8){
        tan = new THREE.Vector3(0,1,0).cross(c.dir);
        if(tan.lengthSq() < 1e-8) tan = new THREE.Vector3(1,0,0).cross(c.dir);
      }
      tan.normalize();
      const newUp = c.dir.clone().multiplyScalar(Math.cos(minAng))
                     .add(tan.multiplyScalar(Math.sin(minAng))).normalize();
      pPos.copy(newUp.multiplyScalar(PLANET_R));
      reTangent();
    }
  }
}

// Tilt-shift (miniature toy-world look) + soft vignette
const TiltShiftShader = {
  uniforms: { tDiffuse:{value:null}, resolution:{value:new THREE.Vector2(1,1)},
              focus:{value:0.54}, range:{value:0.12}, strength:{value:3.2} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 resolution;
    uniform float focus; uniform float range; uniform float strength;
    varying vec2 vUv;
    void main(){
      float d = clamp((abs(vUv.y-focus)-range)/(1.0-range), 0.0, 1.0);
      vec2 px = (d*d*strength)/resolution;
      vec4 c = texture2D(tDiffuse, vUv)*0.227;
      c += texture2D(tDiffuse, vUv+vec2(px.x,0.0)*1.4)*0.155;
      c += texture2D(tDiffuse, vUv-vec2(px.x,0.0)*1.4)*0.155;
      c += texture2D(tDiffuse, vUv+vec2(0.0,px.y)*1.4)*0.155;
      c += texture2D(tDiffuse, vUv-vec2(0.0,px.y)*1.4)*0.155;
      c += texture2D(tDiffuse, vUv+vec2(px.x,px.y)*2.2)*0.0757;
      c += texture2D(tDiffuse, vUv-vec2(px.x,px.y)*2.2)*0.0757;
      float v = smoothstep(1.15, 0.45, distance(vUv, vec2(0.5)));   // vignette
      c.rgb *= mix(1.0, v, 0.32);
      gl_FragColor = c;
    }`
};

// ---------- Post-processing (toggleable: SSAO + bloom + tilt-shift + SMAA) ----------
let composer=null, fxOn=false, tiltPass=null;
const fxBtn=document.getElementById('fxBtn');
function buildComposer(){
  try{
    composer=new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const ssao=new SSAOPass(scene, camera, innerWidth, innerHeight);
    ssao.kernelRadius=0.5; ssao.minDistance=0.0008; ssao.maxDistance=0.12;   // tuned for our small scale
    composer.addPass(ssao);
    composer.addPass(new OutputPass());                                       // ACES tonemap + sRGB
    tiltPass=new ShaderPass(TiltShiftShader);
    tiltPass.uniforms.resolution.value.set(innerWidth, innerHeight);
    composer.addPass(tiltPass);
    const pr=renderer.getPixelRatio();
    composer.addPass(new SMAAPass(innerWidth*pr, innerHeight*pr));
  }catch(err){ console.warn('FX unavailable:', err); composer=null; }
}
function setFx(on){
  if(on && !composer) buildComposer();
  fxOn = on && !!composer;
  fxBtn.classList.toggle('on', fxOn);
  fxBtn.textContent = fxOn ? '✨ 特效:開' : '✨ 特效';
}
fxBtn.addEventListener('click', ()=> setFx(!fxOn));
if(!isTouch) setFx(true);   // desktop on by default; phones opt in

// ---------- Loop ----------
const clock=new THREE.Clock();
const _camPos=new THREE.Vector3(), _camTarget=new THREE.Vector3();
function tick(){
  const dt=Math.min(clock.getDelta(), 0.05);
  if(started) update(dt);
  try { if(fxOn && composer) composer.render(); else renderer.render(scene, camera); }
  catch(err){ console.warn('FX render failed, disabling:', err); fxOn=false; renderer.render(scene, camera); }
  requestAnimationFrame(tick);
}
function update(dt){
  // --- gather movement input as forward/right components, relative to the camera ---
  let fComp=0, rComp=0;
  if(keys['KeyW']||keys['ArrowUp'])    fComp+=1;
  if(keys['KeyS']||keys['ArrowDown'])  fComp-=1;
  if(keys['KeyD']||keys['ArrowRight']) rComp+=1;
  if(keys['KeyA']||keys['ArrowLeft'])  rComp-=1;
  if(isTouch){ fComp += -move.y; rComp += move.x; }   // joystick: up = into the view

  let moving=false;
  const inMag=Math.hypot(fComp,rComp);
  if(inMag>0.12){
    // desired heading in the tangent plane, built from where the camera looks
    const viewYaw=(gyroOn?gyroYaw:0);
    const vDir=camDir.clone().applyAxisAngle(pUp, viewYaw).normalize();
    const vRight=new THREE.Vector3().crossVectors(vDir, pUp).normalize(); // screen-right
    const D=vDir.multiplyScalar(fComp).add(vRight.multiplyScalar(rComp));
    D.sub(pUp.clone().multiplyScalar(D.dot(pUp)));
    if(D.lengthSq()>1e-6){
      D.normalize();
      moving=true;
      // move position along D (great-circle), transporting facing + camera look with it
      const dist=Math.min(1,inMag)*MOVE_SPEED*dt;
      const axis=new THREE.Vector3().crossVectors(pUp, D).normalize();
      const q=new THREE.Quaternion().setFromAxisAngle(axis, dist/PLANET_R);
      pPos.applyQuaternion(q); pFwd.applyQuaternion(q);   // NOTE: camDir is NOT moved
      pPos.copy(surface(pPos)); reTangent();
      camDir.sub(pUp.clone().multiplyScalar(camDir.dot(pUp)));  // only re-tangent the look, never rotate it
      if(camDir.lengthSq()<1e-6) camDir.copy(pFwd);
      camDir.normalize();
      // smoothly rotate the avatar to face the direction of travel
      const cosA=THREE.MathUtils.clamp(pFwd.dot(D),-1,1), ang=Math.acos(cosA);
      if(ang>1e-3){
        const sign=Math.sign(new THREE.Vector3().crossVectors(pFwd,D).dot(pUp))||1;
        pFwd.applyAxisAngle(pUp, Math.min(ang, 12*dt)*sign);
        reTangent();
      }
    }
  }
  resolveCollisions();  // keep player out of trees & houses

  // jump / gravity
  if(keys['Space'] && grounded){ vAlt=JUMP_V; grounded=false; squashY=1.18; Sound.jump(); }
  if(!grounded){
    vAlt-=GRAVITY*dt; altitude+=vAlt*dt;
    if(altitude<=0){ altitude=0; vAlt=0; grounded=true; squashY=0.78; camDip=0.28; Sound.land();
      spawnPuff(pUp.clone().multiplyScalar(terrainRadius(pUp)), pUp.clone(),
        {n:10, color:0xe9ddc7, spd:1.9, rise:0.5, size:0.24, life:0.45}); }
  }

  // place avatar on the terrain surface (so it never sinks into hills)
  player.position.copy(pUp.clone().multiplyScalar(terrainRadius(pUp)+altitude));
  orient(player, pUp, pFwd);
  // jump/land squash & stretch (volume-preserving) + camera dip decay
  squashY += (1-squashY)*Math.min(1, dt*12);
  const sxz=1/Math.sqrt(squashY);
  player.scale.set(sxz, squashY, sxz);
  camDip *= Math.max(0, 1-dt*8);
  // footsteps (sound + little dust) — works for procedural and model avatars
  if(moving && grounded){ stepAccum+=dt; if(stepAccum>=0.3){ stepAccum=0; Sound.step();
    spawnPuff(pUp.clone().multiplyScalar(terrainRadius(pUp)), pUp.clone(), {n:3, color:0xe8dcc4, spd:0.7, rise:0.15, size:0.13, life:0.35}); } }
  else stepAccum=0.3;

  // walk animation
  const tNow=performance.now()*0.001;
  if(charIsModel){
    if(charMixer) charMixer.update(dt);
    const w=(moving && grounded)?1:0;                           // crossfade walk/idle
    if(charAct.walk) charAct.walk.weight=THREE.MathUtils.lerp(charAct.walk.weight, w, 0.18);
    if(charAct.idle) charAct.idle.weight=THREE.MathUtils.lerp(charAct.idle.weight, 1-w, 0.18);
  } else if(moving && grounded){
    walkPhase+=dt*10;
    const s=Math.sin(walkPhase)*0.4;
    avatar.userData.legL.rotation.x=s; avatar.userData.legR.rotation.x=-s;
    avatar.userData.armL.rotation.x=-s; avatar.userData.armR.rotation.x=s;
    avatar.position.y=Math.abs(Math.sin(walkPhase))*0.06;       // walk bounce
  } else {
    avatar.userData.legL.rotation.x*=0.8; avatar.userData.legR.rotation.x*=0.8;
    avatar.userData.armL.rotation.x*=0.8; avatar.userData.armR.rotation.x*=0.8;
    avatar.position.y=Math.sin(tNow*2)*0.018;                   // idle breathing
  }

  // animate mailbox rings
  const t=performance.now()*0.001;
  for(const mb of mailboxes){
    if(mb.userData.done) continue;
    mb.userData.ring.rotation.z=t*1.5;
    mb.userData.ring.scale.setScalar(1+Math.sin(t*3)*0.06);
    mb.userData.flag.rotation.z=Math.sin(t*4)*0.15;
  }
  cloudGroup.rotation.y+=dt*0.01;

  // ambient life
  waterTime.value += dt;
  const at=performance.now()*0.001;
  for(const s of treeSway){ s.o.quaternion.copy(s.q); s.o.rotateOnAxis(s.ax, Math.sin(at*1.3+s.ph)*0.035); }
  pollen.rotation.y += dt*0.02;
  for(const b of butterflies){
    const u=b.userData, ang=at*u.sp+u.ph, base=u.anchor;
    let t1=new THREE.Vector3(0,1,0).cross(base); if(t1.lengthSq()<1e-4) t1.set(1,0,0); t1.normalize();
    const t2=new THREE.Vector3().crossVectors(base,t1).normalize();
    const off=t1.clone().multiplyScalar(Math.cos(ang)*u.r).add(t2.clone().multiplyScalar(Math.sin(ang)*u.r));
    const dir=base.clone().add(off.multiplyScalar(0.06)).normalize();
    b.position.copy(dir.clone().multiplyScalar(terrainRadius(dir)+u.h+Math.sin(at*3+u.ph)*0.1));
    orient(b, dir, t2);
    const f=Math.sin(at*16+u.ph)*0.6+0.3;
    u.wl.rotation.z=Math.PI/2 - f; u.wr.rotation.z=-Math.PI/2 + f;
  }

  // emotes float
  for(let i=emoteSprites.length-1;i>=0;i--){
    const sp=emoteSprites[i]; sp.userData.life+=dt;
    const base=player.position.clone().add(pUp.clone().multiplyScalar(sp.userData.off.y+sp.userData.life*1.2));
    sp.position.copy(base);
    sp.material.opacity=Math.max(0,1-sp.userData.life/1.6);
    if(sp.userData.life>1.6){ scene.remove(sp); emoteSprites.splice(i,1); }
  }
  updatePuffs(dt);

  // timer
  elapsed=(performance.now()-startTime)/1000;
  elTimer.textContent=fmtTime(elapsed);

  // guide arrow toward the current parcel's mailbox
  if(currentTarget){
    const near=currentTarget.position.distanceTo(player.position) < DELIVER_RANGE*1.3;
    arrowPivot.visible=!near;
    if(!near){
      const td=currentTarget.userData.dir;
      const bearing=td.clone().sub(pUp.clone().multiplyScalar(td.dot(pUp)));
      if(bearing.lengthSq()>1e-6){ bearing.normalize();
        arrowPivot.position.copy(player.position).add(pUp.clone().multiplyScalar(1.9+Math.sin(at*3)*0.08));
        arrowPivot.quaternion.setFromUnitVectors(_UPY, bearing);
      }
    }
  } else arrowPivot.visible=false;

  // --- camera (orbit behind the look direction, on planet up) ---
  const up=pUp;
  // gentle auto-recenter behind the player while walking (skipped during manual drag / gyro)
  if(moving && dragId===null && !gyroOn){
    const cs=THREE.MathUtils.clamp(camDir.dot(pFwd),-1,1), a=Math.acos(cs);
    if(a>1e-3){
      const sign=Math.sign(new THREE.Vector3().crossVectors(camDir,pFwd).dot(up))||1;
      camDir.applyAxisAngle(up, Math.min(a, 1.5*dt)*sign);
      camDir.sub(up.clone().multiplyScalar(camDir.dot(up))).normalize();
    }
  }
  const pitch = (gyroOn && gyroPitch!=null) ? gyroPitch : camPitch;
  // camera looks along camDir, plus an optional gyro offset
  const f=camDir.clone().applyAxisAngle(up, gyroOn?gyroYaw:0).normalize();
  const back=f.clone().multiplyScalar(-1);
  const offsetDir=back.clone().multiplyScalar(Math.cos(pitch)).add(up.clone().multiplyScalar(Math.sin(pitch))).normalize();
  _camPos.copy(player.position).add(offsetDir.multiplyScalar(camDist)).add(up.clone().multiplyScalar(0.6 - camDip));
  camera.position.lerp(_camPos, 0.15);
  _camTarget.copy(player.position).add(up.clone().multiplyScalar(0.8));
  camera.up.copy(up);
  camera.lookAt(_camTarget);

  // --- HUD compass / prompt ---
  if(currentTarget){
    elCompass.style.opacity='1';
    elDist.textContent=currentTarget.position.distanceTo(player.position).toFixed(1)+' m';
    const {mb,d}=nearestTarget();
    if(mb && d<=DELIVER_RANGE) elPrompt.classList.add('show'); else elPrompt.classList.remove('show');
  } else {
    elCompass.style.opacity='0'; elPrompt.classList.remove('show');
  }
}
// keep image-based reflections subtle across every standard material
scene.traverse(o=>{
  if(o.material && 'envMapIntensity' in o.material){ o.material.envMapIntensity = ENV_INTENSITY; }
});

// ---------- Smooth shading: remove the hard faceted look ----------
// Average face normals across shared vertex positions so rounded shapes shade
// smoothly. Boxes stay crisp (their geometry keeps per-face normals).
function smoothNormals(geo){
  geo.computeVertexNormals();
  const pos=geo.attributes.position, nrm=geo.attributes.normal, acc=new Map();
  const key=i=>pos.getX(i).toFixed(2)+'_'+pos.getY(i).toFixed(2)+'_'+pos.getZ(i).toFixed(2);
  for(let i=0;i<pos.count;i++){
    const k=key(i); let a=acc.get(k); if(!a){ a=[0,0,0]; acc.set(k,a); }
    a[0]+=nrm.getX(i); a[1]+=nrm.getY(i); a[2]+=nrm.getZ(i);
  }
  for(let i=0;i<pos.count;i++){
    const a=acc.get(key(i)), l=Math.hypot(a[0],a[1],a[2])||1;
    nrm.setXYZ(i, a[0]/l, a[1]/l, a[2]/l);
  }
  nrm.needsUpdate=true;
}
const _smoothed=new Set();
scene.traverse(o=>{
  if(o.isMesh && o.geometry && o.geometry.index===null && !_smoothed.has(o.geometry)){
    smoothNormals(o.geometry); _smoothed.add(o.geometry);   // faceted polyhedra -> smooth
  }
  if(o.material && 'flatShading' in o.material && o.material.flatShading){
    o.material.flatShading=false; o.material.needsUpdate=true;
  }
});

// ---------- Toon / cel shading (toggle, layered on the current render) ----------
const toonGrad = (()=>{
  const d=new Uint8Array([105,170,235,255]);      // 4-band cel ramp (red channel)
  const t=new THREE.DataTexture(d, d.length, 1, THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t;
})();
const toonBtn=document.getElementById('toonBtn');
const toonPairs=[];
scene.traverse(o=>{
  if(o.userData && o.userData.noToon) return;       // e.g. water keeps its translucent material
  if(o.material && o.material.isMeshStandardMaterial){
    const s=o.material;
    const t=new THREE.MeshToonMaterial({
      color:s.color.clone(), map:s.map||null, gradientMap:toonGrad,
      vertexColors:s.vertexColors, transparent:s.transparent, opacity:s.opacity,
      side:s.side, flatShading:s.flatShading,
      emissive:(s.emissive ? s.emissive.clone() : new THREE.Color(0x000000))
    });
    if(o===planet) injectTerrain(t);   // keep per-fragment terrain colour in toon mode
    toonPairs.push({o, std:s, toon:t});
  }
});
let toonOn=false;
function setToon(on){
  toonOn=on;
  for(const p of toonPairs) p.o.material = on ? p.toon : p.std;
  toonBtn.classList.toggle('on', on);
  toonBtn.textContent = on ? '🎨 卡通:開' : '🎨 卡通';
}
toonBtn.addEventListener('click', ()=> setToon(!toonOn));
setToon(true);   // cartoon look on by default

// ---------- Experimental: face control (raise eyebrows to jump) ----------
function triggerJump(){ if(grounded){ vAlt=JUMP_V; grounded=false; squashY=1.18; Sound.jump(); } }
let faceOn=false, faceLandmarker=null, faceVideo=null, faceRAF=null, mouthArmed=true, mouthStart=0;
const faceBtn=document.getElementById('faceBtn');
const MOUTH_ON=0.4, MOUTH_OFF=0.2, MOUTH_HOLD=80;   // mouth open (jawOpen) >=80ms = jump
faceBtn.addEventListener('click', async ()=>{
  if(faceOn){ stopFace(); return; }
  faceBtn.textContent='😮 載入中…';
  try{
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    faceLandmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
      baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate:'GPU' },
      outputFaceBlendshapes:true, runningMode:'VIDEO', numFaces:1
    });
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:320, height:240 }, audio:false });
    faceVideo = document.createElement('video');
    faceVideo.srcObject=stream; faceVideo.muted=true; faceVideo.playsInline=true; faceVideo.setAttribute('playsinline','');
    await faceVideo.play();
    faceOn=true; faceBtn.classList.add('on'); faceBtn.textContent='😮 張嘴跳';
    faceLoop();
  }catch(err){ console.warn('Face control failed:', err); faceBtn.textContent='😮 不支援'; stopFace(); }
});
function stopFace(){
  faceOn=false; faceBtn.classList.remove('on');
  if(!/不支援|載入/.test(faceBtn.textContent)) faceBtn.textContent='😮 表情控制';
  if(faceRAF) cancelAnimationFrame(faceRAF);
  if(faceVideo && faceVideo.srcObject){ faceVideo.srcObject.getTracks().forEach(t=>t.stop()); faceVideo.srcObject=null; }
}
function faceLoop(){
  if(!faceOn) return;
  faceRAF=requestAnimationFrame(faceLoop);
  if(!faceLandmarker || !faceVideo || faceVideo.readyState<2) return;
  let res; try{ res=faceLandmarker.detectForVideo(faceVideo, performance.now()); }catch(e){ return; }
  const cat = res && res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
  if(!cat) return;
  const get=n=>{ const c=cat.find(x=>x.categoryName===n); return c?c.score:0; };
  const mouth=get('jawOpen');                  // mouth-open strength
  const now=performance.now();
  if(mouth>MOUTH_ON){
    if(mouthStart===0) mouthStart=now;
    if(mouthArmed && now-mouthStart>=MOUTH_HOLD){ mouthArmed=false; if(started) triggerJump(); }
  } else if(mouth<MOUTH_OFF){
    mouthStart=0; mouthArmed=true;                              // re-arm when mouth closes
  }
}

tick();
</script>
</body>
